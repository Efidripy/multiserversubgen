auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_streams_per_user: 10000
  max_query_series: 2000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # TSDB retention is enforced by the compactor. Keep two weeks of operator
  # evidence without letting filesystem storage grow unbounded.
  retention_period: 336h

compactor:
  working_directory: /var/lib/loki/compactor
  # A small single-node install does not need ten-minute table compaction.
  # Thirty minutes lowers periodic CPU/I/O work while keeping retention timely.
  compaction_interval: 30m
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
