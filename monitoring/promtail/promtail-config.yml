server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: adguard-querylog
    static_configs:
      - targets:
          - localhost
        labels:
          job: adguard-querylog
          host: ${HOSTNAME}
          __path__: __ADGUARD_QUERYLOG_PATH__
