name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "install.sh"
      - "update.sh"
      - "scripts/**"
      - "systemd/**"
      - "docs/**"
      - "PROJECT.md"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "install.sh"
      - "update.sh"
      - "scripts/**"
      - "systemd/**"
      - "docs/**"
      - "PROJECT.md"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.txt

      - name: Lint backend
        run: ruff check backend

      - name: Run full backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck scripts
        run: |
          git ls-files -z '*.sh' | xargs -0r shellcheck -S error
