version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    # Routine version bumps are handled deliberately, not as background PR noise.
    # Security alerts remain enabled and are grouped into one reviewable change.
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    # Keep critical fixes, but do not open routine version-update PRs.
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
