version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      frontend-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
