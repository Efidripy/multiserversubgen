<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>VPN Sub Manager</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0a0e1a;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #0a0e1a;
      }

      html:has(.app-bootstrap),
      body:has(.app-bootstrap) {
        height: 100%;
        overflow: hidden;
      }

      .app-bootstrap {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        background: #0a0e1a;
      }

      .app-bootstrap__spinner {
        box-sizing: border-box;
        width: 28px;
        height: 28px;
        border: 2px solid rgba(34, 211, 238, 0.2);
        border-top-color: #67e8f9;
        border-radius: 999px;
        animation: app-bootstrap-spin 800ms linear infinite;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap__spinner {
          animation: none;
        }
      }
    </style>
    <script>
      (function () {
        var icons = [
          "favicons/net-fun-01.svg",
          "favicons/net-fun-02.svg",
          "favicons/net-fun-03.svg",
          "favicons/net-fun-04.svg",
          "favicons/net-fun-05.svg",
          "favicons/net-fun-06.svg",
          "favicons/net-fun-07.svg",
          "favicons/net-fun-08.svg",
          "favicons/net-fun-09.svg",
          "favicons/net-fun-10.svg"
        ];
        var pick = icons[Math.floor(Math.random() * icons.length)];
        var link = document.querySelector("link[rel='icon']") || document.createElement("link");
        link.setAttribute("rel", "icon");
        link.setAttribute("type", "image/svg+xml");
        link.setAttribute("href", pick + "?r=" + Date.now());
        if (!link.parentNode) {
          document.head.appendChild(link);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="app-bootstrap" role="status" aria-label="Загрузка интерфейса"><div class="app-bootstrap__spinner" aria-hidden="true"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
